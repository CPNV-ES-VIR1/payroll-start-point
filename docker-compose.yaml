services:

  ms-payroll-database:
    image: mysql:8.0
    container_name: ms-payroll-database
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${MYSQL_VOLUME}:/var/lib/mysql
    networks:
      - payroll
    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-h",
        "localhost",
        "-u",
        "root",
        "-p${MYSQL_ROOT_PASSWORD}"
      ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------
  # Employee microservices
  # -----------------------------
  ms-payroll-employees:
    build: microservices/payroll/employees
    container_name: ms-payroll-employees
    depends_on:
      ms-payroll-database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    networks:
      - payroll
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------
  # Customers microservice
  # -----------------------------
  ms-customers:
    build:
      context: microservices/sales/customers
    container_name: ms-sales-customers
    networks:
      - sales
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -----------------------------
  # Nginx API Gateway
  # -----------------------------
  ms-api-gateway:
    build: microservices/dmz/api-gateway
    container_name: ms-api-gateway
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      ms-payroll-employees:
        condition: service_healthy
      ms-customers:
        condition: service_healthy
    networks:
      - dmz
      - payroll
      - sales
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dmz:
    driver: bridge
  payroll:
    driver: bridge
    internal : true
  sales:
    driver: bridge
    internal : true

volumes:
  mysql-payroll-data:
